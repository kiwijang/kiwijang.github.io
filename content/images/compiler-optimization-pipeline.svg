<text x='340' y='366' font-size='19' fill='#42536b'>語法樹 syntax tree</text><path d='M340 376 V395' stroke='#42536b' stroke-width='2' marker-end='url(#arrow)'/><rect x='45' y='400' width='590' height='92' rx='6' fill='#f0f6fc' stroke='#28608c' stroke-width='2'/><text x='340' y='436' font-size='24' font-weight='600' fill='#163d5c'>語意分析</text><text x='340' y='467' font-size='18' fill='#42536b'>Semantic Analyzer</text><path d='M340 492 V508' stroke='#42536b' stroke-width='2'/>
