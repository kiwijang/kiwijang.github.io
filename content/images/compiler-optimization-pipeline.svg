<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1260" viewBox="0 0 680 1260" role="img" aria-labelledby="title desc"><title id="title">編譯器的七階段流程</title><desc id="desc">字元流經詞彙分析（Lex／Flex 產生的 scanner）、語法分析（Yacc／Bison 產生的 parser）、語意分析、中間碼產生、機器無關最佳化、程式碼產生、機器相關最佳化，輸出目標機器碼。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42536b"/></marker></defs><rect width="680" height="1260" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" text-anchor="middle">
